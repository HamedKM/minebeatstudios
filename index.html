<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minebeat Studios</title>
<meta name="description" content="Minebeat Studios — games, music, brands and entertainment.">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#1d2330,#0b0d12 60%);color:#F5F3EE;font-family:Inter,system-ui,sans-serif}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(46px,10vw,110px);line-height:.95;margin:0;letter-spacing:1px;text-transform:uppercase}
h1 span{color:#9CA8B4}
p.tag{color:#9CA8B4;letter-spacing:5px;text-transform:uppercase;font-size:13px;margin:18px 0 48px}
.card{display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit;background:#171b24;border:1px solid #262c38;border-radius:20px;padding:16px 22px 16px 16px;max-width:460px;width:100%;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:#FF6A00}
.card img{width:120px;height:auto;border-radius:10px;background:#0b0d12}
.card div{text-align:left}
.card b{display:block;font-size:18px}
.card small{color:#9CA8B4}
.soon{margin-top:22px;color:#9CA8B4;font-size:14px}
footer{text-align:center;color:#5d6773;font-size:13px;padding:20px}
</style>
</head>
<body>
<main>
  <h1>Minebeat<br><span>Studios</span></h1>
  <p class="tag">Games · Music · Brands · Entertainment</p>
  <a class="card" href="egoshot/">
    <img src="egoshot/img/logo.webp" alt="EgoShot" width="250" height="92">
    <div><b>EgoShot</b><small>The basketball party game where your ego does the talking.</small></div>
  </a>
  <p class="soon">More projects coming soon.</p>
</main>
<footer>© <span id="y">2026</span> Minebeat Studios</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
